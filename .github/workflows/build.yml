name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          swift --version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: FujiDropKit unit tests (macOS)
        run: swift test --package-path Packages/FujiDropKit

      - name: Build FujiDropSpike (iOS device, unsigned)
        run: |
          set -o pipefail
          xcodebuild build -quiet \
            -project FujiDrop.xcodeproj \
            -scheme FujiDropSpike \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Build FujiDrop (iOS device, unsigned)
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          xcodebuild build -quiet \
            -project FujiDrop.xcodeproj \
            -scheme FujiDrop \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO
